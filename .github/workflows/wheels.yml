name: Wheels

# Builds one wheel per platform, vendoring that platform's cdylib, and smokes
# each wheel by installing it into a clean environment and running the parity
# suite against it. PUBLISHING is a separate, owner-gated step: the PyPI name
# and the Python floor are owner decisions (fontist/fontisan#166). There is no
# publish job in this repository yet.
#
# The package is pure Python with a vendored cdylib, so setuptools tags the
# wheel `py3-none-any`; that is wrong (each wheel carries one OS/arch binary),
# so every wheel is retagged with its real platform before smoke and upload.
#
# Written, not yet run.

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'src/**'
      - 'ENGINE_REV'
      - 'FONTISAN_REV'
      - 'CORPUS_REV'
      - 'scripts/**'
      - '.github/workflows/wheels.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-glibc-x86_64, os: ubuntu-22.04, lib: libfontisan_cdylib.so, platform_tag: manylinux_2_35_x86_64 }
          - { name: linux-musl-x86_64, os: ubuntu-22.04, lib: libfontisan_cdylib.so, platform_tag: musllinux_1_2_x86_64, container: 'alpine:3.20' }
          - { name: macos-arm64, os: macos-15, lib: libfontisan_cdylib.dylib, platform_tag: macosx_11_0_arm64 }
          - { name: macos-x64, os: macos-15-intel, lib: libfontisan_cdylib.dylib, platform_tag: macosx_11_0_x86_64 }
          - { name: windows-x64, os: windows-2022, lib: fontisan_cdylib.dll, platform_tag: win_amd64 }
    container: ${{ matrix.container }}
    env:
      # Rust's musl target defaults to static CRT linkage, incompatible with cdylib.
      RUSTFLAGS: ${{ matrix.container && '-C target-feature=-crt-static' || '' }}
    steps:
      - name: Alpine prerequisites (musl)
        if: matrix.container
        run: apk add --no-cache bash git curl build-base python3 py3-pip py3-virtualenv nodejs
      - name: Install stable Rust for musl
        if: matrix.container
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - name: Read the Ruby source pin
        id: pin
        shell: bash
        run: echo "rev=$(cat FONTISAN_REV)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: fontist/fontisan
          ref: ${{ steps.pin.outputs.rev }}
          path: fontisan-source
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.container }}
      - uses: actions/setup-python@v5
        if: ${{ !matrix.container }}
        with:
          python-version: '3.12'
      - name: Build the cdylib
        run: cargo build --release --manifest-path ext/fontisan_cdylib/Cargo.toml
        working-directory: fontisan-source
      - name: Stage and verify the vendored engine
        shell: bash
        run: python3 scripts/stage_cdylib.py --fontisan-source fontisan-source "fontisan-source/ext/fontisan_cdylib/target/release/${{ matrix.lib }}"
      - name: Build and retag the wheel
        shell: bash
        run: |
          python3 -m venv .venv-build
          if [ -f .venv-build/Scripts/activate ]; then . .venv-build/Scripts/activate; else . .venv-build/bin/activate; fi
          python -m pip install -U pip wheel setuptools
          python -m pip wheel . --no-deps -w dist
          python -m wheel tags --remove --python-tag py3 --abi-tag none \
            --platform-tag "${{ matrix.platform_tag }}" dist/*.whl
      - name: Fetch the shared corpus
        shell: bash
        run: python3 scripts/corpus_fetch.py
      - name: Smoke the wheel (clean venv, parity suite against the installed wheel)
        shell: bash
        run: |
          python3 -m venv .venv-smoke
          if [ -f .venv-smoke/Scripts/activate ]; then . .venv-smoke/Scripts/activate; else . .venv-smoke/bin/activate; fi
          python -m pip install dist/*.whl pytest
          python -c "import fontisan; print(fontisan.abi_version(), fontisan.engine_rev(), fontisan.cdylib_path())"
          # run from outside src/ so the installed wheel, not the tree, is imported
          cd tests && FONTISAN_REQUIRE_CORPUS=1 FONTISAN_CORPUS_DIR="$GITHUB_WORKSPACE/.corpus/fontisan" \
            python -m pytest . -q -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
