name: CI

# Editable install against the Ruby tier cdylib at FONTISAN_REV,
# then the full corpus-parity suite.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Read the Ruby source pin
        id: pin
        shell: bash
        run: echo "rev=$(cat FONTISAN_REV)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: fontist/fontisan
          ref: ${{ steps.pin.outputs.rev }}
          path: fontisan-source
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build the C-ABI cdylib
        run: cargo build --release --manifest-path ext/fontisan_cdylib/Cargo.toml
        working-directory: fontisan-source
      - name: Stage and verify the cdylib
        run: python3 scripts/stage_cdylib.py --fontisan-source fontisan-source fontisan-source/ext/fontisan_cdylib/target/release/libfontisan_cdylib${{ matrix.os == 'macos-15' && '.dylib' || '.so' }}
      - name: Fetch the shared corpus
        run: python3 scripts/corpus_fetch.py
      - name: Install
        run: python3 -m pip install -e . pytest
      - name: Test (corpus parity included)
        run: python3 -m pytest tests -q
        env:
          FONTISAN_REQUIRE_CORPUS: '1'
